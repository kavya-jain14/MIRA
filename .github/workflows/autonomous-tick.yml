name: MIRA autonomous scheduler tick

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mira-autonomous-scheduler
  cancel-in-progress: false

jobs:
  tick:
    # No backend exists until MIRA_API_URL is configured. Manual runs still
    # execute and report a missing URL as an actionable setup error.
    if: github.event_name != 'schedule' || vars.MIRA_API_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Wake API and process due agents
        env:
          MIRA_API_URL: ${{ vars.MIRA_API_URL }}
        run: node scripts/scheduler-tick.mjs
