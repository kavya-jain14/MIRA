name: MIRA autonomous scheduler tick

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mira-autonomous-scheduler
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake API and process due agents
        env:
          MIRA_API_URL: ${{ vars.MIRA_API_URL }}
        run: |
          if [ -z "$MIRA_API_URL" ]; then
            echo "::error::Set the repository variable MIRA_API_URL to the Render origin."
            exit 1
          fi

          curl --fail --show-error --silent \
            --max-time 180 \
            --retry 2 \
            --retry-delay 5 \
            --request POST \
            "${MIRA_API_URL%/}/api/internal/scheduler/tick"
